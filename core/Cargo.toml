[package]
name = "protondrive-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core logic bridging the KIO protondrive:// worker to the Proton Drive CLI"

[lib]
name = "protondrive_core"
# staticlib: linked into the C++ worker binary via CMake/Corrosion.
# rlib: needed for `cargo test` and for the cxx-generated bridge code itself.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned, not "1": Cargo.lock is gitignored and regenerated fresh by every
# packaging build (debian/scripts/prepare-offline-build.sh's `cargo
# generate-lockfile`, the AUR PKGBUILD's prepare()), so an unpinned "1"
# would ship whatever cxx release is newest on build day, untested. The
# exact pin keeps the cxx crate, cxx-build and the cxxbridge-cmd Corrosion
# installs to match (see CMakeLists.txt) on a version CI actually built.
# Bump cxx and cxx-build together, and validate the offline PPA build with
# the target series' rustc (docs/LAUNCHPAD.md) before merging.
#
# This used to be held at 1.0.198 on the belief that 1.0.199+ broke the
# link (undefined `cxxbridge1$std$vector$<T>$...` symbols in the KIO
# plugins). That turned out to be Arch makepkg's LTO, not cxx: the same
# undefined symbols show up with 1.0.198 too (#103, #111).
cxx = "=1.0.202"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
cxx-build = "=1.0.202"

[dev-dependencies]
tempfile = "3"
