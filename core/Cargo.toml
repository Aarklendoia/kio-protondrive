[package]
name = "protondrive-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core logic bridging the KIO protondrive:// worker to the Proton Drive CLI"

[lib]
name = "protondrive_core"
# staticlib: linked into the C++ worker binary via CMake/Corrosion.
# rlib: needed for `cargo test` and for the cxx-generated bridge code itself.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Pinned, not "1": confirmed live that cxx 1.0.199 (the next patch release
# after this) breaks the build against the pinned Corrosion v0.6.0 (see
# CMakeLists.txt) — Corrosion's own separate `cargo install cxxbridge-cmd`
# codegen step and the actual `cxx` crate compiled here fell out of sync,
# leaving `cxxbridge1$std$vector$<T>$...` symbols undefined at link time for
# the KIO worker plugin. 1.0.198 confirmed working. An unpinned "1" is fine
# day-to-day (Cargo.lock, once generated, holds it steady) but bites the
# moment that lockfile gets regenerated fresh — which every packaging build
# does (debian/scripts/prepare-offline-build.sh's `cargo generate-lockfile`,
# and any from-source distro package like an AUR PKGBUILD).
cxx = "=1.0.198"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }

[build-dependencies]
cxx-build = "=1.0.198"

[dev-dependencies]
tempfile = "3"
