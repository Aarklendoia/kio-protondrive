name: Build KIO Worker (CMake)

# Compiles the actual protondrive:// worker plugin against KF6::KIOCore —
# separate from test.yml (which only builds/tests the pure-Rust core/ crate
# and needs no KF6/Qt6 at all). This is the only CI job that exercises the
# CMake + Corrosion + cxx integration end to end.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # libkf6kio-dev only exists from Ubuntu 25.10 (Questing) onward — see
    # https://packages.ubuntu.com/search?keywords=libkf6kio-dev — but
    # ubuntu-latest is still Noble (24.04). Build inside a newer container
    # instead (26.04, matching this project's own target series, see
    # publish-ppa.yml's default SERIES).
    container: ubuntu:26.04
    timeout-minutes: 30

    steps:
      - name: Install base tooling and KDE Frameworks / Qt6 build dependencies
        # ca-certificates/git are needed for actions/checkout, build-essential
        # for the cxx bridge's C++ compile — all preinstalled on the regular
        # ubuntu-latest VM image, but not in this minimal container.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            cmake \
            extra-cmake-modules \
            pkg-config \
            qt6-base-dev \
            libkf6kio-dev \
            libkf6coreaddons-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
