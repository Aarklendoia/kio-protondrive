name: Build Gentoo Overlay

# Generates the Gentoo overlay (packaging/gentoo/make-overlay.sh), builds
# its ebuild with emerge, and attaches the overlay to the GitHub release on
# tags (#182). On PRs it only runs when the packaging, the Cargo manifests
# (they decide the ebuild's CRATES) or the top-level CMake setup change —
# release-please's PR included, since it bumps the workspace version.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'packaging/gentoo/**'
      - '.github/workflows/build-gentoo.yml'
      - 'Cargo.toml'
      - '*/Cargo.toml'
      - 'CMakeLists.txt'
  workflow_dispatch:

# contents: write for the same reason as build-arch.yml (the release step
# creates/updates the GitHub release), packages for the CI image (#194).
permissions:
  contents: write
  packages: write

jobs:
  image:
    # The build job runs in an image with the dependencies and tooling
    # preinstalled (packaging/gentoo/ci/Dockerfile): installing ~230 binary
    # packages from scratch was ~12 minutes of every run. Its tag is the
    # ISO week plus the Dockerfile's hash, so it's built and pushed here by
    # the first run of each week or after the Dockerfile changes, and
    # pulled by every other run.
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Name the image
        id: image
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$(date -u +%G-W%V)-$(sha256sum packaging/gentoo/ci/Dockerfile | cut -c1-12)"
          echo "ref=ghcr.io/$owner/kio-protondrive-gentoo-ci:$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push the image if missing
        env:
          REF: ${{ steps.image.outputs.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "$REF already exists"
          else
            docker build -t "$REF" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              packaging/gentoo/ci
            docker push "$REF"
          fi

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Lets Portage's network-sandbox (a network namespace) work, so the
      # build really runs offline: nothing else stops Corrosion's
      # FetchContent or `cargo install cxxbridge-cmd` from silently
      # reaching the network.
      options: --privileged

    steps:
      - name: Set up Portage
        # Everything else is in the image. MAKEOPTS depends on this
        # runner: without it, Portage builds (cargo included) on one core.
        run: echo "MAKEOPTS=\"-j$(nproc)\"" >> /etc/portage/make.conf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate overlay
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keeps the crates it downloads where the Manifest step looks (#190).
          CRATE_DISTDIR="$(portageq distdir)" \
            packaging/gentoo/make-overlay.sh /var/db/repos/kio-protondrive
          cat > /etc/portage/repos.conf/kio-protondrive.conf <<EOF
          [kio-protondrive]
          location = /var/db/repos/kio-protondrive
          EOF

      - name: Generate Manifest
        # Off a tag, the vX.Y.Z tarball the ebuild names doesn't exist yet
        # (release-please's PR) or isn't this code: put an archive of the
        # checked-out tree in DISTDIR under that name instead, the same way
        # build-arch.yml does (#179). Only the tag's Manifest is published.
        run: |
          ebuild_file="$(echo /var/db/repos/kio-protondrive/kde-misc/kio-protondrive/*.ebuild)"
          p="$(basename "$ebuild_file" .ebuild)"
          if [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            distdir="$(portageq distdir)"
            mkdir -p "$distdir"
            git archive --format=tar.gz --prefix="$p/" -o "$distdir/$p.tar.gz" HEAD
          fi
          ebuild "$ebuild_file" manifest

      - name: Run pkgcheck
        run: pkgcheck scan --exit error /var/db/repos/kio-protondrive

      - name: Build and test
        # package.env (set above) runs src_test too.
        run: emerge --quiet-build --getbinpkg --usepkg --verbose kde-misc/kio-protondrive

      - name: Check the plugins load
        # They link with -z,undefs, so a successful link proves nothing:
        # resolve every symbol now, like kioworker would when loading them.
        run: |
          for so in $(qlist kde-misc/kio-protondrive | grep '\.so$'); do
            python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1], mode=2)' "$so"
            echo "OK $so"
          done

      - name: Pack overlay
        # metadata/md5-cache is emerge's cache from the build above, not
        # part of the overlay (#197).
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          tar -czf "kio-protondrive-gentoo-overlay-$version.tar.gz" \
            --exclude=kio-protondrive/metadata/md5-cache \
            -C /var/db/repos kio-protondrive

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gentoo-overlay
          path: 'kio-protondrive-gentoo-overlay-*.tar.gz'
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: kio-protondrive-gentoo-overlay-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
