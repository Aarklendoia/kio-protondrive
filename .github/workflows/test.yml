name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No KF6/Qt6 dev packages needed here: core/'s only native dependency is
      # a C++17 compiler for the cxx bridge (build.rs), and daemon/'s only
      # native dependency is a C compiler for rusqlite's bundled SQLite —
      # ubuntu-latest ships both by default. Compiling the actual KIO worker
      # plugin against KF6::KIOCore is covered separately by build-cmake.yml.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-ci-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --profile ci
