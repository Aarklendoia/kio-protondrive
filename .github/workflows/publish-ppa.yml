name: Publish to Launchpad PPA

# Automatically uploads a source package to ppa:aarklendoia-edtech/kio-protondrive
# on every vX.Y.Z release tag (same trigger as build-debian.yml's GitHub
# Release build). See docs/LAUNCHPAD.md for the full manual process this
# automates, and for how the ~ppa1~<series>1 versioning scheme works.
#
# A release tag uploads one source package per supported Ubuntu series
# (the matrix below), each vendored with that series' own packaged cargo.
# workflow_dispatch uploads for the one series given as input instead, e.g.
# to publish an existing tag for a newly released series.
#
# Signs with a CI-only GPG key, registered as an additional OpenPGP key on
# the aarklendoia-edtech Launchpad account — deliberately separate from the
# maintainer's personal key (and from linux-hello's own CI key), so a
# leaked CI secret only compromises this package's PPA-upload rights. The
# private key has no passphrase (required for unattended signing); it's
# stored only as the PPA_GPG_PRIVATE_KEY repository secret.
#
# GPG_KEY_ID below is the CI signing key's fingerprint, registered on the
# aarklendoia-edtech Launchpad account — see docs/LAUNCHPAD.md for the
# one-time setup this came from. The matching private key is stored as the
# PPA_GPG_PRIVATE_KEY repository secret (not committed anywhere).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      series:
        description: 'Target Ubuntu series codename'
        required: true
        default: 'stonking'
      rust_toolchain:
        description: "That series' packaged cargo/rustc version (rmadison -u ubuntu cargo)"
        required: true
        default: '1.97.1'

env:
  PPA: 'ppa:aarklendoia-edtech/kio-protondrive'
  GPG_KEY_ID: 'D61B393270CB976FBF38147EE8A85F33C5CF96B1'
  DEBFULLNAME: 'kio-protondrive CI'
  DEBEMAIL: 'aarklendoia+ci@proton.me'

jobs:
  publish-ppa:
    name: publish-ppa (${{ matrix.series }})
    strategy:
      fail-fast: false
      # Supported series and their packaged cargo/rustc
      # (rmadison -u ubuntu cargo). The "~ppa1~<series>1" versions sort by
      # codename, which Ubuntu assigns alphabetically, so a release upgrade
      # (resolute -> stonking) also upgrades this package.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && format('[{{"series":"{0}","rust_toolchain":"{1}"}}]', inputs.series, inputs.rust_toolchain)
          || '[{"series":"resolute","rust_toolchain":"1.93.1"},{"series":"stonking","rust_toolchain":"1.97.1"}]') }}
    env:
      SERIES: ${{ matrix.series }}
      RUST_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    runs-on: ubuntu-latest
    # Confirmed live: the v0.8.0 release's run of this workflow hung on the
    # "Install packaging tools" step below for the full 6h GitHub Actions
    # default before being force-cancelled — never even reached Vendor/
    # Build/Upload, so v0.8.0 was silently never published to the PPA. Every
    # other workflow in this repo already sets this (build-cmake.yml,
    # test.yml, quality.yml); this one was the one exception. Doesn't
    # explain the hang itself (see DEBIAN_FRONTEND below for the leading
    # suspect) but turns a repeat into a fast, visible failure instead of
    # another silent 6h no-op.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install packaging tools
        # No project build-dependencies needed here (qt6-base-dev,
        # libkf6kio-dev, ...) — debuild -S only tars the source, it doesn't
        # compile anything, and cargo vendor doesn't run build scripts either.
        #
        # DEBIAN_FRONTEND/NEEDRESTART_MODE: this step runs directly on the
        # ubuntu-latest VM image (a full system with real running services),
        # unlike build-debian.yml/build-cmake.yml's minimal `container:`
        # jobs — the likely reason this one specifically is exposed to
        # needrestart's interactive "which services to restart?" prompt
        # after upgrading a library dependency, which `-y` alone doesn't
        # suppress. Never confirmed directly (GitHub's own timeout kills the
        # job before it can dump diagnostic output), but it's the standard,
        # well-documented cause of exactly this "apt-get install just hangs
        # forever despite -y" symptom on a non-containerized Ubuntu runner.
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts dpkg-dev debhelper fakeroot quilt dput lintian gnupg jq git

      - name: Install Rust matching ${{ env.SERIES }}'s packaged toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Import the CI signing key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          echo "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys "$GPG_KEY_ID"

      - name: Vendor Cargo dependencies and Corrosion
        run: |
          RUST_TOOLCHAIN="${{ env.RUST_TOOLCHAIN }}" ./debian/scripts/prepare-offline-build.sh

      - name: Bump changelog for this PPA upload
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # workflow_dispatch on a branch: no vX.Y.Z tag to derive from
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.+)"/\1/')"
          fi
          dch --newversion "${VERSION}~ppa1~${SERIES}1" --distribution "$SERIES" --urgency medium \
            "Automated PPA build for ${SERIES}, release ${VERSION}."

      - name: Build signed source package
        run: |
          rm -rf target build
          debuild -S -sa -d -k"$GPG_KEY_ID"

      - name: Upload to the PPA
        run: |
          dput "$PPA" ../kio-protondrive_*_source.changes
