name: Build Debian Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # libkf6kio-dev only exists from Ubuntu 25.10 (Questing) onward — see
    # https://packages.ubuntu.com/search?keywords=libkf6kio-dev — but
    # ubuntu-latest is still Noble (24.04). Build inside a newer container
    # instead (26.04, matching this project's own target series, see
    # publish-ppa.yml's default SERIES).
    container: ubuntu:26.04

    steps:
      - name: Install base tooling and build dependencies
        # ca-certificates/git are needed for actions/checkout, curl for
        # dtolnay/rust-toolchain (it shells out to rustup.rs) — all
        # preinstalled on the regular ubuntu-latest VM image but not in this
        # minimal container.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq \
            build-essential \
            debhelper \
            devscripts \
            quilt \
            lintian \
            cmake \
            extra-cmake-modules \
            pkg-config \
            qt6-base-dev \
            libkf6kio-dev \
            libkf6coreaddons-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Debug Rust environment
        run: |
          echo "HOME=$HOME"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-<unset>}"
          echo "CARGO_HOME=${CARGO_HOME:-<unset>}"
          echo "PATH=$PATH"
          which rustc cargo rustup || true
          rustup toolchain list --verbose || true

      - name: Cache Cargo build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Vendor Cargo dependencies and Corrosion
        # dpkg-buildpackage builds with no network access — dh_auto_configure
        # (debhelper compat 13) passes -DFETCHCONTENT_FULLY_DISCONNECTED=ON,
        # and CMakeLists.txt's FetchContent of Corrosion fails without a
        # pre-populated source dir. Same constraint as the Launchpad PPA
        # build (see docs/LAUNCHPAD.md), same fix. RUST_TOOLCHAIN defaults to
        # "stable" here (unlike publish-ppa.yml, which pins to the target
        # series' packaged cargo/rustc) because this job vendors and builds
        # with the same dtolnay/rust-toolchain@stable install.
        run: ./debian/scripts/prepare-offline-build.sh

      - name: Generate debian/changelog entry for this release
        # Only on the tag release-please creates (vX.Y.Z) — regular
        # branch/PR builds keep whatever entry is already committed. This is
        # generated fresh at build time, never committed back: release-please
        # already owns Cargo.toml's version and CHANGELOG.md (see
        # CONTRIBUTING.md).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBFULLNAME: Aarklendoia
          DEBEMAIL: aarklendoia@proton.me
        run: |
          cd $GITHUB_WORKSPACE
          VERSION="${GITHUB_REF_NAME#v}"
          # No "-1" Debian revision suffix: "3.0 (native)" format (see
          # debian/source/format) uses the upstream version alone.
          dch --newversion "${VERSION}" --distribution unstable --urgency medium \
            "Automated release ${VERSION}. See CHANGELOG.md for full details."

      - name: Build Debian packages
        run: |
          cd $GITHUB_WORKSPACE
          # -d: ignore missing build-deps since rustc/cargo come from rustup, not apt.
          dpkg-buildpackage -us -uc -b -d
          cp ../*.deb . 2>/dev/null || true
          cp ../*.buildinfo . 2>/dev/null || true
          cp ../*.changes . 2>/dev/null || true

      - name: Run lintian checks
        run: |
          cd $GITHUB_WORKSPACE
          lintian *.deb || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: |
            *.deb
            *.buildinfo
            *.changes
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.buildinfo
            *.changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
