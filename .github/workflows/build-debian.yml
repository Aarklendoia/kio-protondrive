name: Build Debian Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Needed for the "Create Release (on tag)" step (softprops/action-gh-release)
# to create/update a GitHub release — the repo's default GITHUB_TOKEN
# permissions are read-only (Settings → Actions → General), so without this
# it fails with "Resource not accessible by integration". Same pattern as
# release-please.yml.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04, the PPA's series (publish-ppa.yml's default
          # SERIES). The release .deb files link against its Qt, glibc and
          # libstdc++, so they don't install on older releases.
          - { name: ubuntu-26.04, image: 'ubuntu:26.04', suffix: '', distribution: unstable }
          # Debian 13 gets its own build (#208), with a "+deb13" version
          # suffix so its files don't clash with Ubuntu's in the release.
          - { name: debian-13, image: 'debian:trixie', suffix: '+deb13', distribution: trixie }
    runs-on: ubuntu-latest
    # libkf6kio-dev isn't in ubuntu-latest (Noble, 24.04): build inside the
    # target distribution's own container instead.
    container: ${{ matrix.image }}

    steps:
      - name: Install base tooling and build dependencies
        # ca-certificates/git are needed for actions/checkout, curl for
        # dtolnay/rust-toolchain (it shells out to rustup.rs) — all
        # preinstalled on the regular ubuntu-latest VM image but not in this
        # minimal container.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            debhelper \
            devscripts \
            quilt \
            lintian \
            cmake \
            extra-cmake-modules \
            pkg-config \
            libsqlite3-dev \
            qt6-base-dev \
            libkf6kio-dev \
            libkf6coreaddons-dev \
            python3

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Vendor Corrosion
        # dh_auto_configure (debhelper compat 13) always passes
        # -DFETCHCONTENT_FULLY_DISCONNECTED=ON regardless of actual network
        # access, so CMakeLists.txt's FetchContent of Corrosion needs a
        # pre-populated source dir — same constraint as the Launchpad PPA
        # build (see docs/LAUNCHPAD.md). Unlike Launchpad's builders, this
        # runner has real network access, so SKIP_CARGO_VENDOR=1: only
        # Corrosion needs vendoring, cargo can fetch crates.io normally
        # (also needed for Corrosion's own separate `cargo install
        # cxxbridge-cmd` — that one isn't covered by vendoring core/'s
        # dependencies at all, vendored or not).
        run: SKIP_CARGO_VENDOR=1 ./debian/scripts/prepare-offline-build.sh

      - name: Generate debian/changelog entry for this release
        # Only on the tag release-please creates (vX.Y.Z) — regular
        # branch/PR builds keep whatever entry is already committed. This is
        # generated fresh at build time, never committed back: release-please
        # already owns Cargo.toml's version and CHANGELOG.md (see
        # CONTRIBUTING.md).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEBFULLNAME: Aarklendoia
          DEBEMAIL: aarklendoia@proton.me
        run: |
          VERSION="${GITHUB_REF_NAME#v}${{ matrix.suffix }}"
          # No "-1" Debian revision suffix: "3.0 (native)" format (see
          # debian/source/format) uses the upstream version alone.
          dch --newversion "${VERSION}" --distribution ${{ matrix.distribution }} --urgency medium \
            "Automated release ${VERSION}. See CHANGELOG.md for full details."

      - name: Build Debian packages
        run: |
          # -d: ignore missing build-deps since rustc/cargo come from rustup, not apt.
          dpkg-buildpackage -us -uc -b -d
          cp ../*.deb . 2>/dev/null || true
          cp ../*.buildinfo . 2>/dev/null || true
          cp ../*.changes . 2>/dev/null || true

      - name: Run lintian checks
        run: |
          lintian ./*.deb || true

      - name: Install and check the plugins load
        # Installs the packages into this same distribution, which checks
        # their dependencies resolve there, then resolves every symbol of
        # the plugins now, like kioworker would when loading them.
        run: |
          apt-get install -y ./*.deb
          for so in $(dpkg -L kio-protondrive kio-protondrive-sync-daemon | grep '\.so$'); do
            python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1], mode=2)' "$so"
            echo "OK $so"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages-${{ matrix.name }}
          path: |
            *.deb
            *.buildinfo
            *.changes
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            *.buildinfo
            *.changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
