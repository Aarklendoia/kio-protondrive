version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Dependabot adds the ":" itself, and include: "scope" adds "(deps)" /
    # "(deps-dev)": titles come out as "chore(deps): Update ...".
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # cxx and cxx-build are both pinned to the same exact version in
      # core/Cargo.toml: bumped one at a time, Cargo can't resolve the
      # other (#97/#98). Before merging such a bump, validate the offline
      # PPA build (core/Cargo.toml's comment, docs/LAUNCHPAD.md).
      cxx:
        patterns:
          - "cxx"
          - "cxx-build"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
