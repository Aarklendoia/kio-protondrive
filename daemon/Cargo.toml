[package]
name = "kio-protondrive-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Background daemon that pins/unpins and syncs local copies of Proton Drive files"

[dependencies]
protondrive-core = { path = "../core" }
notify = "6"
notify-debouncer-full = "0.3"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
