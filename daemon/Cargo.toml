[package]
name = "kio-protondrive-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Background one-way local -> Proton Drive upload sync daemon"

[dependencies]
protondrive-core = { path = "../core" }
notify = "8"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1.1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
